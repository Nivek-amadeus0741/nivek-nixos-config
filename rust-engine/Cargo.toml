[workspace]
resolver = "2"
members = [
    "crates/nivek-wasm-abi",
    "crates/nivek-core",
    "crates/nivek-cli",
]

[workspace.metadata.crane]
name = "rust-engine"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nivek <nivek@local>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
